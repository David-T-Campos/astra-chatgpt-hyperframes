name: Render ARGUS Engineer video

on:
  push:
    branches:
      - 1517-materials
    paths:
      - .github/workflows/render.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1517-materials
      - uses: actions/setup-node@v4
        with:
          node-version: '25.5.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run setup -- --accept-font-license
      - name: Render with installed Chrome
        env:
          HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run render
      - name: Verify render
        run: |
          test -s output/argus-engineer.mp4
          ffmpeg -v error -i output/argus-engineer.mp4 -f null -
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 output/argus-engineer.mp4
      - name: Publish render to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f output/argus-engineer.mp4 output/verification.json || true
          if git diff --cached --quiet; then
            echo 'Render already current.'
            exit 0
          fi
          git commit -m 'Publish Argus Engineer Film 01'
          git push origin HEAD:1517-materials
