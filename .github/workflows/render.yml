name: Verify ARGUS Film 01

on:
  push:
    branches:
      - 1517-materials
    paths:
      - output/argus-engineer.mp4
      - .github/workflows/render.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1517-materials

      - name: Verify Film 01 hash and decode
        shell: bash
        run: |
          set -euo pipefail
          f=output/argus-engineer.mp4
          test -s "$f"
          test "$(stat -c%s "$f")" -eq 9992946
          echo '93c7b64e4b4a051598a6a2b6bc882436c4cd829fbd09e2d3933539d779314bf0  output/argus-engineer.mp4' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -v error -i "$f" -f null -
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type -of default=noprint_wrappers=1 "$f"
